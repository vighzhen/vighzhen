name: 更新主页统计

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_stats.py'
      - '.github/workflows/profile-stats.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: profile-statistics-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 获取仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 从 GitHub 官方 API 生成统计
        env:
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: python3 scripts/build_stats.py --login "$GITHUB_REPOSITORY_OWNER" --output "_site"

      - name: 上传统计页面
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - name: 发布统计
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
